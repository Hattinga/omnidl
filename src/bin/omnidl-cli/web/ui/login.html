<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>Anmelden – omnidl</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<script src="/login.js" defer></script>
</head>
<body class="login-page">
<form class="login-card" id="login" novalidate>
  <img src="/icon.png" alt="" width="76" height="76">
  <h1>omnidl</h1>
  <p>Passwort eingeben, um fortzufahren.</p>
  <input type="text" name="username" autocomplete="username" value="omnidl" hidden>
  <div class="field">
    <input id="password" name="password" type="password" autocomplete="current-password"
           placeholder="Passwort" aria-label="Passwort" required>
  </div>
  <button class="primary" id="submit" type="submit">Anmelden</button>
  <p class="error" id="error" role="alert"></p>
</form>
</body>
</html>
