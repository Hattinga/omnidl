[package]
name = "omnidl"
version = "0.2.0"
edition = "2024"
description = "Desktop-Downloader für YouTube, TikTok, Spotify und rund 1800 weitere Seiten"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36.2"
futures-util = "0.3.34"
lofty = "0.25.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "native-tls", "stream"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
strsim = "0.11.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "sync", "io-util", "macros", "time", "net"] }
tokio-util = "0.7.19"
toml = "1.1.6"
urlencoding = "2.1.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
