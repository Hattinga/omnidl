[package]
name = "omnidl"
version = "0.2.0"
edition = "2024"
description = "Desktop-Downloader für YouTube, TikTok, Spotify und rund 1800 weitere Seiten"
build = "build.rs"
license = "MIT"
repository = "https://github.com/Hattinga/omnidl"
autobins = false

[lib]
name = "omnidl"
path = "src/lib.rs"

# The desktop app.
[[bin]]
name = "omnidl"
path = "src/main.rs"
required-features = ["gui"]

# Terminal downloads and the web interface for servers; needs no graphics libraries.
[[bin]]
name = "omnidl-cli"
path = "src/bin/omnidl-cli/main.rs"
required-features = ["cli"]

[features]
default = ["gui", "cli"]
gui = ["dep:eframe", "dep:egui", "dep:rfd"]
cli = ["dep:clap", "dep:axum", "dep:tokio-stream", "dep:getrandom", "dep:crossterm", "dep:unicode-width", "dep:if-addrs"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"], optional = true }
# Terminal size and ANSI support on Windows consoles for the live display.
crossterm = { version = "0.29.0", default-features = false, features = ["windows"], optional = true }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.36.2", optional = true }
futures-util = "0.3.34"
getrandom = { version = "0.4.3", optional = true }
if-addrs = { version = "0.15.0", optional = true }
lofty = "0.25.4"
regex = "1.13.1"
# TLS backend per platform, see the target sections below.
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "stream"] }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
strsim = "0.11.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "sync", "io-util", "macros", "time", "net", "signal", "fs"] }
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }
tokio-util = "0.7.19"
toml = "1.1.6"
unicode-width = { version = "0.2.2", optional = true }
urlencoding = "2.1.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# The system TLS stacks on Windows (SChannel) and macOS (Security.framework).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

# Elsewhere rustls, so Linux builds need no OpenSSL.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# X11 and Wayland windows. rfd's default backend there is already the XDG
# portal (no GTK).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"], optional = true }
# The ffmpeg builds for Linux come as .tar.xz.
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "optimization"] }
tar = { version = "0.4.46", default-features = false }

# Tests build .tar.xz archives.
[target.'cfg(target_os = "linux")'.dev-dependencies]
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "encoder"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
embed-resource = "3.0.11"

# Debian packages, built by packaging/linux/package.sh (cargo deb --no-build):
# `omnidl` is the desktop app, the `cli` variant the terminal program with the
# web interface as a systemd service.
[package.metadata.deb]
name = "omnidl"
maintainer = "Jonas Hattinger <Hattinga@users.noreply.github.com>"
copyright = "2026, Jonas Hattinger"
section = "video"
priority = "optional"
revision = ""
# The window libraries are loaded at run time, so $auto cannot see them.
depends = "$auto, ca-certificates, libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libx11-xcb1, libxcursor1, libxrandr2, libxi6, libwayland-client0, libwayland-cursor0, libwayland-egl1"
# File dialogs (XDG portal) and opening folders.
recommends = "xdg-desktop-portal, xdg-utils"
extended-description = """\
Link einfügen, Format wählen, fertig: YouTube, TikTok, Spotify, Instagram, \
SoundCloud und die übrigen Seiten, die yt-dlp kennt. Lädt seine Werkzeuge \
(yt-dlp, ffmpeg, Deno, gallery-dl) beim ersten Start selbst."""
assets = [
    ["target/release/omnidl", "usr/bin/", "755"],
    ["packaging/linux/omnidl.desktop", "usr/share/applications/", "644"],
    ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/omnidl.png", "644"],
    ["README.md", "usr/share/doc/omnidl/", "644"],
]

[package.metadata.deb.variants.cli]
name = "omnidl-cli"
extended-description = """\
omnidl ohne Fenster: Downloads im Terminal (omnidl-cli get) und ein \
Web-Interface für Server und NAS (omnidl-cli serve). Bringt den \
systemd-Dienst omnidl-web mit, der als Benutzer omnidl läuft und in \
/var/lib/omnidl speichert; er wird nicht automatisch gestartet."""
depends = "$auto, ca-certificates"
recommends = ""
maintainer-scripts = "packaging/linux/deb/"
assets = [
    ["target/release/omnidl-cli", "usr/bin/", "755"],
    ["packaging/linux/omnidl-web.service", "usr/lib/systemd/system/", "644"],
    ["packaging/linux/omnidl-web.default", "etc/default/omnidl-web", "600"],
    ["README.md", "usr/share/doc/omnidl-cli/", "644"],
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
