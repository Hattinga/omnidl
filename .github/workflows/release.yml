name: Release

# Push a tag like v0.3.0 (matching Cargo.toml) to build and publish a release.
# The in-app updater reads the newest release: it needs omnidl.exe and its .sha256.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} passt nicht zu Version $v in Cargo.toml" }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build exe, installer and checksums
        shell: pwsh
        run: ./packaging/release.ps1

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $section = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ') | Where-Object { $_.StartsWith($v) } | Select-Object -First 1
          $notes = if ($section) { ($section -split "`n", 2)[1].Trim() } else { "omnidl $v" }
          Set-Content -Encoding utf8 notes.md $notes

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist).FullName --title "omnidl ${{ github.ref_name }}" --notes-file notes.md
